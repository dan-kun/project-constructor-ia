services:
  - type: web
    name: project-constructor-ia
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -e ".[web]"
    startCommand: uvicorn pcia.web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
