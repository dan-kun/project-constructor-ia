# Plantilla de scaffold: API HTTP con NestJS (TypeScript).
# Tokens disponibles: [[NOMBRE]], [[NOMBRE_KEBAB]], [[PAQUETE]], [[DESCRIPCION]]

stack: nestjs
descripcion: API HTTP con NestJS (TypeScript)
detecta: [nestjs, "nest.js", nest]
archivos:
  "package.json": |
    {
      "name": "[[NOMBRE_KEBAB]]",
      "version": "0.1.0",
      "description": "[[DESCRIPCION]]",
      "private": true,
      "scripts": {
        "build": "nest build",
        "start": "nest start",
        "start:dev": "nest start --watch",
        "start:prod": "node dist/main.js",
        "test": "jest"
      },
      "dependencies": {
        "@nestjs/common": "^10.0.0",
        "@nestjs/core": "^10.0.0",
        "@nestjs/platform-express": "^10.0.0",
        "reflect-metadata": "^0.2.0",
        "rxjs": "^7.8.0"
      },
      "devDependencies": {
        "@nestjs/cli": "^10.0.0",
        "@nestjs/testing": "^10.0.0",
        "@types/jest": "^29.5.0",
        "@types/node": "^20.0.0",
        "jest": "^29.7.0",
        "ts-jest": "^29.1.0",
        "typescript": "^5.4.0"
      },
      "jest": {
        "preset": "ts-jest",
        "testEnvironment": "node",
        "rootDir": "src",
        "testRegex": ".*\\.spec\\.ts$"
      }
    }

  "tsconfig.json": |
    {
      "compilerOptions": {
        "module": "commonjs",
        "target": "ES2021",
        "declaration": true,
        "removeComments": true,
        "emitDecoratorMetadata": true,
        "experimentalDecorators": true,
        "sourceMap": true,
        "outDir": "./dist",
        "baseUrl": "./",
        "strict": true,
        "skipLibCheck": true
      }
    }

  "nest-cli.json": |
    {
      "$schema": "https://json.schemastore.org/nest-cli",
      "collection": "@nestjs/schematics",
      "sourceRoot": "src"
    }

  ".gitignore": |
    node_modules/
    dist/
    .env
    coverage/

  ".env.example": |
    # Copiar a .env y completar. Nunca commitear secretos reales.
    NODE_ENV=development
    PORT=3000

  "Dockerfile": |
    FROM node:20-alpine AS build
    WORKDIR /app
    COPY package*.json ./
    RUN npm ci
    COPY . .
    RUN npm run build

    FROM node:20-alpine
    WORKDIR /app
    COPY --from=build /app/dist ./dist
    COPY --from=build /app/node_modules ./node_modules
    EXPOSE 3000
    CMD ["node", "dist/main.js"]

  "src/main.ts": |
    import { NestFactory } from '@nestjs/core';
    import { AppModule } from './app.module';

    async function bootstrap() {
      const app = await NestFactory.create(AppModule);
      await app.listen(process.env.PORT ?? 3000);
    }
    bootstrap();

  "src/app.module.ts": |
    import { Module } from '@nestjs/common';
    import { AppController } from './app.controller';
    import { AppService } from './app.service';

    @Module({
      controllers: [AppController],
      providers: [AppService],
    })
    export class AppModule {}

  "src/app.controller.ts": |
    import { Controller, Get } from '@nestjs/common';
    import { AppService } from './app.service';

    @Controller()
    export class AppController {
      constructor(private readonly appService: AppService) {}

      @Get('health')
      health(): { status: string } {
        return this.appService.health();
      }
    }

  "src/app.service.ts": |
    import { Injectable } from '@nestjs/common';

    @Injectable()
    export class AppService {
      health(): { status: string } {
        return { status: 'ok' };
      }
    }

  "src/app.controller.spec.ts": |
    import { Test } from '@nestjs/testing';
    import { AppController } from './app.controller';
    import { AppService } from './app.service';

    describe('AppController', () => {
      it('health devuelve ok', async () => {
        const moduleRef = await Test.createTestingModule({
          controllers: [AppController],
          providers: [AppService],
        }).compile();
        const controller = moduleRef.get(AppController);
        expect(controller.health()).toEqual({ status: 'ok' });
      });
    });

  ".github/workflows/ci.yml": |
    name: CI
    on: [push, pull_request]
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-node@v4
            with:
              node-version: "20"
          - run: npm ci
          - run: npm run build
          - run: npm test
