# Plantilla de scaffold: API HTTP con FastAPI (Python).
# Tokens disponibles: [[NOMBRE]], [[NOMBRE_KEBAB]], [[PAQUETE]], [[DESCRIPCION]]

stack: fastapi
descripcion: API HTTP con FastAPI (Python)
detecta: [fastapi, "fast api"]
verificaciones:
  - id: docker-build
    tipo: docker_build
  # el smoke inyecta un secreto de fantasía: sin SECRET_KEY la app no importa
  - id: smoke-import-app
    tipo: docker_run
    comando: ["env", "SECRET_KEY=solo-smoke-test", "python", "-c", "import [[PAQUETE]].main"]
  # opcional: el build y el smoke test son la garantía; sin ruff instalado
  # el resultado queda "aprobado con advertencias", no "inconcluso"
  - id: lint-ruff
    tipo: comando
    requiere: ruff
    obligatoria: false
    comando: ["ruff", "check", "src", "tests"]
# Sección "Cómo ejecutar" del README: comandos determinísticos (el LLM no
# escribe instrucciones operativas, solo contexto y decisiones).
instrucciones: |
  ## Cómo ejecutar

  ```bash
  pip install -e ".[dev]"                    # instalar en modo desarrollo
  uvicorn [[PAQUETE]].main:app --reload      # servidor en http://localhost:8000
  pytest                                     # correr los tests
  ```

  ### Docker

  ```bash
  docker build -t [[NOMBRE_KEBAB]] .
  docker run --rm -p 8000:8000 [[NOMBRE_KEBAB]]
  ```

  ### Configuración

  Copiar `.env.example` a `.env` y completar los valores.
  Nunca commitear secretos reales.
  [[INSTRUCCIONES_EXTRA]]
# Bloques que solo se materializan si la spec los pide: una decisión de la
# entrevista modifica realmente el scaffold, no solo el ADR.
condicionales:
  - id: postgresql
    cuando: {campo: base_datos, contiene: [postgres, postgresql]}
    fragmentos:
      "[[DEPENDENCIAS_EXTRA]]": "\n    \"sqlalchemy>=2.0\",\n    \"psycopg[binary]>=3.1\","
      "[[ENV_EXTRA]]": |
        # URL de PostgreSQL (por defecto apunta al servicio db de compose.yaml)
        DATABASE_URL=postgresql+psycopg://app:app@localhost:5432/[[PAQUETE]]
      "[[INSTRUCCIONES_EXTRA]]": |

        ### Base de datos (PostgreSQL)

        ```bash
        docker compose up -d db    # PostgreSQL 16 local (ver compose.yaml)
        ```

        La URL de conexión sale de `DATABASE_URL` (ver `.env.example`).
    archivos:
      "compose.yaml": |
        services:
          app:
            build: .
            ports: ["8000:8000"]
            environment:
              SECRET_KEY: ${SECRET_KEY:?definir en .env}
              DATABASE_URL: postgresql+psycopg://app:app@db:5432/[[PAQUETE]]
            depends_on:
              db:
                condition: service_healthy
          db:
            image: postgres:16
            environment:
              # credenciales SOLO de desarrollo local; en producción usar
              # un gestor de secretos o variables de entorno del despliegue
              POSTGRES_USER: app
              POSTGRES_PASSWORD: app
              POSTGRES_DB: [[PAQUETE]]
            ports: ["5432:5432"]
            healthcheck:
              test: ["CMD-SHELL", "pg_isready -U app"]
              interval: 5s
              timeout: 3s
              retries: 10
            volumes:
              - pgdata:/var/lib/postgresql/data
        volumes:
          pgdata:

      "src/[[PAQUETE]]/db.py": |
        """Conexión a PostgreSQL (SQLAlchemy).

        Este módulo existe porque la especificación eligió PostgreSQL.
        """
        from collections.abc import Iterator

        from pydantic_settings import BaseSettings
        from sqlalchemy import create_engine
        from sqlalchemy.orm import Session, sessionmaker


        class DBSettings(BaseSettings):
            # default de desarrollo local (compose.yaml); en producción,
            # definir DATABASE_URL en el entorno del despliegue
            database_url: str = "postgresql+psycopg://app:app@localhost:5432/[[PAQUETE]]"

            model_config = {"env_file": ".env"}


        engine = create_engine(DBSettings().database_url, pool_pre_ping=True)
        SessionLocal = sessionmaker(bind=engine)


        def get_session() -> Iterator[Session]:
            """Dependencia de FastAPI: una sesión por request."""
            with SessionLocal() as session:
                yield session

archivos:
  "pyproject.toml": |
    [build-system]
    requires = ["setuptools>=68"]
    build-backend = "setuptools.build_meta"

    [project]
    name = "[[NOMBRE_KEBAB]]"
    version = "0.1.0"
    description = "[[DESCRIPCION]]"
    requires-python = ">=3.10"
    dependencies = [
        "fastapi>=0.110",
        "uvicorn[standard]>=0.29",
        "pydantic-settings>=2.2",[[DEPENDENCIAS_EXTRA]]
    ]

    [project.optional-dependencies]
    dev = ["pytest>=8.0", "httpx>=0.27"]

    [tool.setuptools.packages.find]
    where = ["src"]

  ".gitignore": |
    __pycache__/
    *.py[cod]
    .venv/
    .env
    dist/
    .pytest_cache/

  ".env.example": |
    # Copiar a .env y completar. Nunca commitear secretos reales.
    # SECRET_KEY es obligatoria: la aplicación no arranca sin ella.
    APP_ENV=dev
    SECRET_KEY=
    [[ENV_EXTRA]]

  "Dockerfile": |
    FROM python:3.12-slim
    WORKDIR /app
    COPY pyproject.toml ./
    COPY src/ src/
    RUN pip install --no-cache-dir .
    # la imagen corre como usuario sin privilegios, nunca root
    RUN useradd --create-home --uid 1001 appuser
    USER appuser
    EXPOSE 8000
    CMD ["uvicorn", "[[PAQUETE]].main:app", "--host", "0.0.0.0", "--port", "8000"]

  "src/[[PAQUETE]]/__init__.py": ""

  "src/[[PAQUETE]]/config.py": |
    """Configuración de la aplicación (variables de entorno, ver .env.example).

    SECRET_KEY no tiene valor por defecto a propósito: la aplicación falla
    al arrancar si no está definida, en lugar de correr con una clave débil.
    """
    from pydantic_settings import BaseSettings


    class Settings(BaseSettings):
        app_env: str = "dev"
        secret_key: str  # obligatoria: sin default

        model_config = {"env_file": ".env"}


    settings = Settings()

  "src/[[PAQUETE]]/main.py": |
    """Punto de entrada de [[NOMBRE]]."""
    from fastapi import FastAPI

    from [[PAQUETE]].config import settings

    app = FastAPI(title="[[NOMBRE]]", description="[[DESCRIPCION]]")


    @app.get("/health")
    def health() -> dict[str, str]:
        return {"status": "ok", "env": settings.app_env}

  "tests/conftest.py": |
    """Los tests corren sin .env: se inyecta un secreto de fantasía."""
    import os

    os.environ.setdefault("SECRET_KEY", "solo-para-tests")

  "tests/test_health.py": |
    from fastapi.testclient import TestClient

    from [[PAQUETE]].main import app


    def test_health():
        respuesta = TestClient(app).get("/health")
        assert respuesta.status_code == 200
        assert respuesta.json()["status"] == "ok"

  "tests/test_config.py": |
    """La aplicación no arranca sin SECRET_KEY (seguridad primero)."""
    import pytest
    from pydantic import ValidationError

    from [[PAQUETE]].config import Settings


    def test_sin_secret_key_no_arranca(monkeypatch):
        monkeypatch.delenv("SECRET_KEY", raising=False)
        with pytest.raises(ValidationError):
            Settings(_env_file=None)

  ".github/workflows/ci.yml": |
    name: CI
    on: [push, pull_request]
    jobs:
      test:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v4
          - uses: actions/setup-python@v5
            with:
              python-version: "3.12"
          - run: pip install -e ".[dev]"
          - run: pytest
