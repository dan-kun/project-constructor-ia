[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-constructor-ia"
version = "0.1.0"
description = "Agente inteligente para la creación asistida y auditada de estructuras de proyectos de software"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # tomllib es stdlib desde 3.11; en 3.10 el Verificador necesita tomli
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
# Interfaz web (adaptador de IO opcional): el core sigue sin depender de esto.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# El extra dev tiene que poder correr la suite completa: los tests del
# adaptador web usan el TestClient de fastapi (httpx ya es del core) y
# ejercitan el arranque de pcia-web, que importa uvicorn.
dev = ["pytest>=8.0", "fastapi>=0.115", "uvicorn>=0.30", "ruff>=0.6"]

[project.scripts]
pcia = "pcia.cli:main"
pcia-web = "pcia.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcia = [
    "agents/prompts/*.md",
    "agents/rules/*.yaml",
    "agents/templates/*.yaml",
    "web/static/*",
]

[tool.ruff]
line-length = 105
target-version = "py310"

[tool.ruff.lint]
# El proyecto genera código con ruff opcional para sus plantillas (FastAPI);
# es consistente pedirle lo mismo al propio código del sistema. Alcance
# acotado a errores reales (F) y de estilo básico (E, B): nada de reglas de
# modernización (UP) ni de orden de imports (I), que reordenarían todo el
# código existente sin corregir ningún defecto.
select = ["E", "F", "B"]
