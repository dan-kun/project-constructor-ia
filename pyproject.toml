[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-constructor-ia"
version = "0.1.0"
description = "Agente inteligente para la creación asistida y auditada de estructuras de proyectos de software"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
    # tomllib es stdlib desde 3.11; en 3.10 el Verificador necesita tomli
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.scripts]
pcia = "pcia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pcia = ["agents/prompts/*.md", "agents/rules/*.yaml", "agents/templates/*.yaml"]
